<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlanBi - Mulțumim!</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="/static/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Luxurious+Script&display=swap" rel="stylesheet">
</head>

<body>
    <header>
        <div id="velvet-container"></div>
    </header>
    <main>
        <div class="stk"
            style="min-height: 60vh; display: flex; flex-direction: column; align-items: center; justify-content: center;">
            <div id="main-title" style="margin-bottom: 0.5em;">PlanBi</div>

            <section>
                <div class="card" style="max-width: 500px; margin: 0 auto; text-align: center;">
                    <h2 style="position: static; font-size: 2.5rem; margin-bottom: 1rem;color: black;">Mulțumim!</h2>
                    <p class="text-xl text-highlight font-serif mb-8 mt-8">Cererea ta a fost primită cu succes.</p>
                    <div class="number" id="number"
                        style="font-size: 2em; color: var(--primary-dark); margin-top: 20px;"></div>
                    <a href="/index.html" class="btn" style="margin-top: 2em;">Înapoi la pagina principală</a>
                </div>
            </section>
        </div>
    </main>
    <footer>
        <h4>PlanBi Events &copy; 2025</h4>
        <a href="mailto:contact@planbi.ro">contact@planbi.ro</a>
    </footer>
    <script>
        // Get random number from URL query string
        function getQueryParam(param) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(param);
        }
        const number = getQueryParam('number');
        document.getElementById('number').textContent = number ? `Solicitarea ta poate fi identificată cu numărul: ${number}` : '';
    </script>
    <script src="/static/script.js"></script>
</body>

</html>
